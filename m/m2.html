    <title>Repaso Módulo 2</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<body>

    <header class="max-w-4xl mx-auto text-center mb-8">

        <!-- Recuadro MÓDULO con width 30% -->
        <p class="formula mx-auto p-0 text-sm" style="width: 30%; color: #1f2937; border-color: #d1d5db;">MÓDULO: 2</p>
        
        <h1 class="titulo1 mt-2 mb-4">Repaso General</h1>

            <p class="text-lg text-slate-600">Lee cada pregunta con atención y selecciona la respuesta correcta.</p>

                </div>
                
                <div id="finalScore" class="hidden mt-8 p-6 border-2 border-slate-300 bg-slate-50 rounded-lg flex flex-col justify-center items-center space-y-2"></div>
            </div>
        </form>
    </main>

         DATOS DE LAS PREGUNTAS (TODAS convertidas a opción múltiple)
