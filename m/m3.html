<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Módulo 3</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- CSS CENTRALIZADO -->
    <link rel="stylesheet" href="../assets/css/style-repasos.css">
</head>
<body>

    <header class="max-w-4xl mx-auto text-center mb-8">
        <!-- Logo con ruta corregida -->
        <img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">
        
        <!-- Recuadro MÓDULO con width 30% -->
        <p class="formula mx-auto p-0 text-sm" style="width: 30%; color: #1f2937; border-color: #d1d5db;">MÓDULO: 3</p>
        
        <h1 class="titulo1 mt-2 mb-4">Repaso General</h1>

        <div id="printResultSummary" class="hidden text-center py-4"></div>

        <div class="text-container">
            <h2 class="titulo2 mb-4">Instrucciones:</h2>
            <p class="text-lg text-slate-600">Lee cada pregunta con atención y selecciona la respuesta correcta.</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        <form id="quizForm" onsubmit="return false;">
            <div id="quizContainer"></div>

            <div class="text-container text-center">
                <div class="flex flex-col items-center justify-center space-y-4">
                    <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200" id="checkButton">Verificar respuestas</button>
                    <button type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200 hidden" id="pdfButton">Generar PDF de resultados</button>
                </div>
                
                <div id="finalScore" class="hidden mt-8 p-6 border-2 border-slate-300 bg-slate-50 rounded-lg flex flex-col justify-center items-center space-y-2"></div>
            </div>
        </form>
    </main>

    <!-- ============================================================
         DATOS DE LAS PREGUNTAS (TODAS convertidas a opción múltiple)
         ============================================================ -->
    <script>

            // ============================================================
            {
                sectionTitle: "Sección I: Verbos + -ing para gustos",
                subsections: [
                    {
                        subtitle: "Elige la opción correcta.",

                            },
                            {
                                id: "q3",
                                type: "radio",

                                correct: "don't like eating",
                                explanation: 'Negativo con "they" -> don\'t like + verbo en -ing.'
                            },
                            {
                                id: "q4",
                                type: "radio",
                                question: "4. My brother ______ (hate / wake up) early in the morning.",

                                correct: "hates waking up",
                                explanation: 'Con "my brother" (he) -> hates + verbo en -ing.'
                            },
                            {
                                id: "q5",
                                type: "radio",
                                question: "5. We ______ (enjoy / play) tennis on Saturdays.",

                                correct: "enjoy playing",
                                explanation: 'Con "we" -> enjoy + verbo en -ing.'
                            },
                            {
                                id: "q6",
                                type: "radio",

                                id: "q10",
                                type: "radio",
                                question: "10. They ______ (not / like / travel) by plane.",

                            },
                            {
                                id: "q14",
                                type: "radio",

                            },

                                correct: "my",

                                id: "q24",
                                type: "radio",

                                id: "q26",

                                question: "26. I love my parents. I call ______ every day.",

                                id: "q29",

                                id: "q33",

                                question: "33. I don't have ______ money right now.",

                                explanation: '"Any" se usa en oraciones negativas.'
                            },

                                type: "radio",
