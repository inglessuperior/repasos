<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Módulo 5</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- CSS CENTRALIZADO -->
    <link rel="stylesheet" href="../assets/css/style-repasos.css">
</head>
<body>

    <header class="max-w-4xl mx-auto text-center mb-8">
        <!-- Logo con ruta corregida -->
        <img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">
        
        <!-- Recuadro MÓDULO con width 30% -->
        <p class="formula mx-auto p-0 text-sm" style="width: 30%; color: #1f2937; border-color: #d1d5db;">MÓDULO: 5</p>
        
        <h1 class="titulo1 mt-2 mb-4">Repaso Módulo 5</h1>

        <div id="printResultSummary" class="hidden text-center py-4"></div>

        <div class="text-container">
            <h2 class="titulo2 mb-4">Instrucciones:</h2>
            <p class="text-lg text-slate-600">Lee cada pregunta con atención y selecciona o escribe la respuesta correcta.</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        <form id="quizForm" onsubmit="return false;">
            <div id="quizContainer"></div>

            <!-- Botones y Resultados -->
            <div class="text-container text-center">
                <div class="flex flex-col items-center justify-center space-y-4">
                    <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200" id="checkButton">Verificar respuestas</button>
                    <button type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200 hidden" id="pdfButton">Generar PDF de resultados</button>
                </div>
                
                <div id="finalScore" class="hidden mt-8 p-6 border-2 border-slate-300 bg-slate-50 rounded-lg flex flex-col justify-center items-center space-y-2"></div>
            </div>
        </form>
    </main>

    <!-- ============================================================
         DATOS DE LAS PREGUNTAS (exactamente igual que antes)
         ============================================================ -->
    <script>
        const sectionsData = [
            {

                subsections: [
                    {

                        items: [
                            {
                                id: "q1",

                                id: "q5",

                            },
                            {
                                id: "q26",
                                type: "radio",
                                question: "26. This is ______ (big) office in the entire building.",

                            },
                            {
                                id: "q27",
                                type: "radio",

                            },
                            {
                                id: "q31",

                                question: "31. Today has been ______ (bad) day of my career.",

                                correct: "the worst",
                                explanation: "El adjetivo 'bad' es irregular y su forma superlativa es 'the worst'."
                            },

                                id: "q32",

                            },
                            {
                                id: "q33",
                                type: "radio",
                                question: "33. My brother is not as ______ (tall) as me.",

                                id: "q34",

                                id: "q35",
                                type: "radio",
                                question: "35. Mount Everest is ______ (high) mountain in the world.",

                                id: "q36",
